name: Build and push ARM v7 image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image for linux/arm/v7
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.armv7
          platforms: linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/familyverse:armv7-latest
            ghcr.io/${{ github.repository_owner }}/familyverse:armv7-${{ github.sha }}

      # Regression guard from the #18 board cutover: bookworm-slim ships no
      # OpenSSL 3 and all three custom armv7 Prisma engines link libssl.so.3 —
      # the image built "green" while every engine died at exec with
      # "error while loading shared libraries: libssl.so.3" (first seen only
      # when migrate deploy ran against a live board). Runs the pushed image
      # under the QEMU set up above and fails the run if any engine has
      # unresolved shared libraries. See #18 / commit 5d80a0a.
      - name: Smoke — armv7 engines resolve their shared libraries
        run: |
          docker pull "ghcr.io/${{ github.repository_owner }}/familyverse:armv7-latest"
          docker run --rm --platform linux/arm/v7 --entrypoint sh \
            "ghcr.io/${{ github.repository_owner }}/familyverse:armv7-latest" -ec '
              for e in query-engine migration-engine introspection-engine; do
                echo "== $e"; ldd "/engines/$e";
              done | tee /tmp/ldd.out
              if grep -q "not found" /tmp/ldd.out; then
                echo "missing shared libraries in armv7 engines" >&2; exit 1;
              fi
              echo "all armv7 engines resolve their libraries"'
