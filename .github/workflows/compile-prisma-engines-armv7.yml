name: Compile Prisma engines for armv7 and build image
# NOTE (#12): this workflow must not push the ghcr.io/...:armv7-* application
# tags — only build-and-push-armv7.yml may produce those.

on:
  workflow_dispatch:

permissions:
  contents: read
  # packages:write removed (#12): this workflow no longer pushes images.

jobs:
  compile-prisma:
    name: Compile Prisma engines (armv7)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ca-certificates git curl gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add armv7 target
        run: rustup target add armv7-unknown-linux-gnueabihf

      - name: Clone prisma-engines
        run: git clone https://github.com/prisma/prisma-engines.git

      - name: Build prisma engines for armv7
        run: |
          set -e
          cd prisma-engines
          # Try a release build for armv7; builds may require additional system dependencies.
          cargo build --release --target armv7-unknown-linux-gnueabihf || true

      - name: Collect built binaries
        run: |
          mkdir -p ./prisma-engines-artifacts
          # Copy any produced binaries (best-effort locations)
          find prisma-engines -type f -name 'query-engine*' -exec cp {} ./prisma-engines-artifacts/ \; || true
          find prisma-engines -type f -name 'migration-engine*' -exec cp {} ./prisma-engines-artifacts/ \; || true
          find prisma-engines -type f -name 'introspection-engine*' -exec cp {} ./prisma-engines-artifacts/ \; || true
          ls -la prisma-engines-artifacts || true

      - name: Upload prisma engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prisma-engines-armv7
          path: prisma-engines-artifacts

  build-and-push:
    name: Build linux/arm/v7 image (no push)
    needs: compile-prisma
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prisma engine artifacts
        uses: actions/download-artifact@v4
        with:
          name: prisma-engines-armv7
          path: prisma-engines

      - name: List engines
        run: ls -la prisma-engines || true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up buildx
        uses: docker/setup-buildx-action@v2

      # Ticket #12: this workflow must NEVER push the real armv7 app tags
      # (armv7-latest / armv7-<sha>) — those belong solely to
      # build-and-push-armv7.yml. This job builds ./Dockerfile (not
      # Dockerfile.armv7) and nothing consumes its ./prisma-engines download,
      # so the push existed only to clobber; build as a smoke check, push nothing.
      - name: Build image for linux/arm/v7 (no push)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          push: false
