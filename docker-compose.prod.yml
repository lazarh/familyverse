# Legacy GHCR-image prod stack (superseded once the armv7/Postgres rework,
# ticket #11, lands — kept so prod config is not lost).
services:
  app:
    image: ghcr.io/lazarh/familyverse-app
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}

      DATABASE_URL: ${DATABASE_URL} # Postgres connection string (datasource provider is postgresql)
      NEXTAUTH_URL: ${NEXTAUTH_URL} # URL of your app
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    #volumes:
    #  - ./prisma:/app/prisma # Old SQLite bind-mount; obsolete — data lives in the postgres volume now
    # Migrations run at container start (docker-entrypoint.sh), not at build time.
