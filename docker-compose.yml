# DEV stack: app + Postgres + MailHog, built from source.
# One command from a clean machine: docker compose up
# Every variable below has a default, so this works with NO .env at all.
# Copy .env.example to .env to override anything.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

      # Container-internal endpoints are fixed so a copied or stale .env
      # (whose SMTP_HOST/DATABASE_URL describe the HOST view) cannot break
      # the stack. Host-side values live in .env.example.
      SMTP_HOST: mailhog
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@familyverse.local}

      DATABASE_URL: postgresql://familyverse:familyverse@postgres:5432/familyverse?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-only-nextauth-secret-change-me}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}

      # Seed script (scripts/seed.mjs) — demo user created on container start
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@familyverse.local}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo123}
      # Demo dataset: trump (default, #21) or kessler (the #16 prototype tree).
      SEED_FAMILY: ${SEED_FAMILY:-trump}

      # Picture storage (#15): files under this dir are served same-origin by
      # GET /api/pictures/<file>. Named volume keeps writes on the non-root
      # app user's terms (image dir pre-owned, see Dockerfile).
      PICTURES_DIR: /app/data/pictures
    volumes:
      - pictures_data:/app/data/pictures
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    ports:
      # Published so a bare `npm run dev` on the host can reach the DB too
      - "5432:5432"
    environment:
      # Overriding these also requires updating the app's DATABASE_URL above
      # (fixed in this file) and .env.example's host-side DATABASE_URL.
      POSTGRES_USER: ${POSTGRES_USER:-familyverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familyverse}
      POSTGRES_DB: ${POSTGRES_DB:-familyverse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familyverse} -d ${POSTGRES_DB:-familyverse}"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI / API

volumes:
  postgres_data:
  pictures_data:
